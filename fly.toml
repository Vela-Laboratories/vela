app = 'vela-engine'
primary_region = 'sjc'

[build]

# This deployment is intentionally a testnet demo. Production startup has a
# separate fail-closed configuration contract and must use a different app.
[env]
  VELA_RUNTIME_MODE = 'testnet-demo'
  VELA_CHAIN_ID = '11155111'
  SNAPSHOT_DIR = '/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Fly-managed HTTP healthcheck. On failure, the platform will restart
  # the machine and stop routing traffic to it. Interval + grace balance
  # false positives vs. detection latency for a matching engine.
  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '20s'
    method = 'GET'
    path = '/ready'
    protocol = 'http'

[mounts]
  source = "vela_data"
  destination = "/data"

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
