name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Required for admin-token gated code paths to boot the api crate's
  # AppState during tests.
  ADMIN_TOKEN: ci-admin-token

jobs:
  managed-postgres-readiness:
    name: Managed PostgreSQL readiness preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test provider-neutral fail-closed attestation validation
        run: ./scripts/tests/test_managed_postgres_readiness.sh

  postgres-pitr:
    name: PostgreSQL 16 - PITR rehearsal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore physical backup to named WAL point
        run: ./scripts/rehearse_postgres_pitr.sh

  rust:
    name: Rust — build, test, clippy, fmt
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Bound runner contention so 2s leadership operations are exercised reliably.
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace

      - name: OpenAPI snapshot check
        run: ./scripts/check_openapi_snapshot.sh

      - name: Test (default features)
        run: cargo test --workspace

      - name: Test (all features)
        run: cargo test --workspace --all-features

      - name: Clippy
        # `--all-targets` catches a lot of test-code style issues that
        # aren't worth blocking CI on today. Trim as tests get modernised.
        run: cargo clippy --workspace -- -D warnings

  rust-security:
    name: Rust — cargo-audit
    runs-on: ubuntu-24.04
    permissions:
      # rustsec/audit-check posts a check-run via the API; without this
      # it fails with "Resource not accessible by integration".
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # SQLx's facade crate records its optional MySQL driver in
          # Cargo.lock even though Vela enables PostgreSQL only. The inactive
          # driver is the sole path to rsa 0.9 and cannot execute in Vela.
          ignore: RUSTSEC-2023-0071

  secret-scan:
    name: Secrets — gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 requires a paid license for private
      # repos. Install and invoke the CLI directly instead — that's free
      # under the MIT-licensed release binaries.
      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan working tree + full history
        run: gitleaks detect --source . --redact --verbose --no-banner

  contracts:
    name: Contracts — forge fmt, build, test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show forge version
        run: forge --version

      # OZ + forge-std aren't tracked in the repo (contracts/.gitignore
      # excludes lib/) and there's no root .gitmodules, so fetch them
      # explicitly. Pin to the same SHAs the local dev environment uses
      # so the CI build is reproducible.
      - name: Fetch forge deps
        run: |
          set -euo pipefail
          rm -rf lib
          mkdir -p lib
          git clone --depth 1 --branch v1.15.0 \
            https://github.com/foundry-rs/forge-std.git lib/forge-std
          git clone --depth 1 --branch v5.6.1 \
            https://github.com/OpenZeppelin/openzeppelin-contracts.git \
            lib/openzeppelin-contracts

      - name: Forge fmt check
        run: forge fmt --check

      - name: Forge build
        run: forge build --sizes

      - name: Verify reproducible deployment metadata
        run: ./scripts/reproducible_build.sh

      - name: Forge test
        run: forge test -vvv

  contracts-coverage:
    name: Contracts — forge coverage
    runs-on: ubuntu-24.04
    continue-on-error: true
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Fetch forge deps
        run: |
          set -euo pipefail
          rm -rf lib
          mkdir -p lib
          git clone --depth 1 --branch v1.15.0 \
            https://github.com/foundry-rs/forge-std.git lib/forge-std
          git clone --depth 1 --branch v5.6.1 \
            https://github.com/OpenZeppelin/openzeppelin-contracts.git \
            lib/openzeppelin-contracts
      - name: Coverage
        run: forge coverage --report summary

  frontend:
    name: Frontend — build, lint, type-check, test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
      - run: npm test
      - name: TypeScript SDK contract and types
        run: |
          cmp lib/api-types.gen.ts ../sdk/typescript/src/schema.ts
          ./node_modules/.bin/tsc -p ../sdk/typescript/tsconfig.json
          node --experimental-strip-types --test ../sdk/typescript/tests/client.test.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read-only Python SDK tests
        run: PYTHONPATH=../sdk/python python -m unittest discover -s ../sdk/python/tests

  frontend-audit:
    name: Frontend — full dependency audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit

  bench:
    name: Benchmarks (dry run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Bench dry run
        run: cargo bench --workspace -- --test
