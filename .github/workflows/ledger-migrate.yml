name: Ledger Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing DATABASE_MIGRATOR_URL
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate ${{ inputs.environment }} ledger
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    concurrency: ledger-migrate-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Apply forward-only ledger migrations
        env:
          DATABASE_MIGRATOR_URL: ${{ secrets.DATABASE_MIGRATOR_URL }}
        run: cargo run --locked --release -p ledger --bin ledger-migrate
      - name: Reapply least-privilege database grants
        env:
          DATABASE_MIGRATOR_URL: ${{ secrets.DATABASE_MIGRATOR_URL }}
        run: psql "$DATABASE_MIGRATOR_URL" -v ON_ERROR_STOP=1 -f ledger/sql/roles.sql
      - name: Bootstrap ETH/USDC ledger accounts
        env:
          DATABASE_MIGRATOR_URL: ${{ secrets.DATABASE_MIGRATOR_URL }}
          VELA_CHAIN_ID: ${{ vars.VELA_CHAIN_ID }}
          VELA_USDC_ADDRESS: ${{ vars.VELA_USDC_ADDRESS }}
          VELA_CUSTODY_VAULT_ADDRESS: ${{ vars.VELA_CUSTODY_VAULT_ADDRESS }}
        run: cargo run --locked --release -p ledger --bin ledger-bootstrap
      - name: Register immutable custody deployment
        env:
          DATABASE_MIGRATOR_URL: ${{ secrets.DATABASE_MIGRATOR_URL }}
          VELA_INDEXER_DEPLOYMENT_ID: ${{ vars.VELA_INDEXER_DEPLOYMENT_ID }}
          VELA_INDEXER_NETWORK: ${{ vars.VELA_INDEXER_NETWORK }}
          VELA_CHAIN_ID: ${{ vars.VELA_CHAIN_ID }}
          VELA_CUSTODY_VAULT_ADDRESS: ${{ vars.VELA_CUSTODY_VAULT_ADDRESS }}
          VELA_CUSTODY_VAULT_DEPLOYMENT_VERSION: ${{ vars.VELA_CUSTODY_VAULT_DEPLOYMENT_VERSION }}
          VELA_CUSTODY_VAULT_CODE_HASH: ${{ vars.VELA_CUSTODY_VAULT_CODE_HASH }}
          VELA_CUSTODY_VAULT_START_BLOCK: ${{ vars.VELA_CUSTODY_VAULT_START_BLOCK }}
        run: cargo run --locked --release -p indexer --bin deposit-indexer-register
