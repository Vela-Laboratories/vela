# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --build-arg VELA_BUILD_ID="${GITHUB_SHA}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify machine and health after deploy
        run: |
          flyctl status --app vela-engine
          flyctl checks list --app vela-engine
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 10 https://vela-engine.fly.dev/health; then
              exit 0
            fi
            sleep 5
          done
          echo "Fly deployment did not become healthy" >&2
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
